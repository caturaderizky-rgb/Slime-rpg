<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Slime Hunter RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>SLIME HUNTER</h1>
        <p>Cute Pixel RPG · Adventure Mode</p>
      </div>
      <button id="restart" aria-label="Mulai ulang">↻</button>
    </header>

    <section class="stats">
      <div class="stat">
        <span>❤️ HP</span><strong id="hp">100/100</strong>
        <div class="bar"><div id="hpBar"></div></div>
      </div>
      <div class="stat"><span>🪙 Koin</span><strong id="coins">0</strong></div>
      <div class="stat"><span>👾 Kalah</span><strong id="kills">0</strong></div>
    </section>

    <section class="progress">
      <div><span id="areaName">AREA 1 · GREEN MEADOW</span><span id="areaCount">1/3</span></div>
      <div class="area-track"><div id="areaBar"></div></div>
    </section>

    <div class="arena">
      <canvas id="game" width="320" height="400"></canvas>
      <div id="overlay" class="overlay hidden">
        <h2 id="overlayTitle">GAME OVER</h2>
        <p id="overlayText">Petualangan berakhir.</p>
        <button id="playAgain">Main Lagi</button>
      </div>
      <div id="cardOverlay" class="card-overlay hidden">
        <h2>PILIH KARTU</h2>
        <p>Pilih satu bonus untuk melanjutkan.</p>
        <div id="cardChoices" class="card-choices"></div>
      </div>
    </div>

    <p id="message">Jelajahi area dan kalahkan musuh!</p>

    <section class="controls">
      <div class="joystick-area">
        <div id="joystick" class="joystick"><div id="stick" class="stick"></div></div>
        <small>GERAK</small>
      </div>
      <button id="attack" class="attack"><span>⚔️</span><small>SERANG</small></button>
    </section>
    <p class="hint">Kalahkan semua musuh untuk membuka jalan ke area berikutnya.</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
